<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="860" height="210" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="h-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14" />
      <stop offset="50%" stop-color="#081226" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>

    <!-- Moving Cyan Radial Glow -->
    <radialGradient id="h-glow" cx="32%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#1e40af" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050b14" stop-opacity="0" />
      <animate attributeName="cx" values="30%;40%;30%" dur="10s" repeatCount="indefinite" />
    </radialGradient>

    <!-- Name Metallic Gradient -->
    <linearGradient id="h-name" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Underline Gradient -->
    <linearGradient id="h-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="65%" stop-color="#2563eb" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </linearGradient>

    <!-- Fine Technical Grid -->
    <pattern id="h-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="24" y2="0" stroke="#1e3a8a" stroke-width="0.5" stroke-opacity="0.2" />
      <line x1="0" y1="0" x2="0" y2="24" stroke="#1e3a8a" stroke-width="0.5" stroke-opacity="0.2" />
      <circle cx="0" cy="0" r="0.7" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Filter for Glow -->
    <filter id="h-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="860" height="210" rx="12" fill="url(#h-bg)" />
  <rect width="860" height="210" rx="12" fill="url(#h-grid)" />
  <rect width="860" height="210" rx="12" fill="url(#h-glow)" />
  <rect x="0.5" y="0.5" width="859" height="209" rx="11.5" fill="none" stroke="#1e3a8a" stroke-width="1" stroke-opacity="0.55" />

  <!-- Corner Accent Brackets -->
  <path d="M 12,22 L 12,12 L 22,12" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.8" />
  <path d="M 848,22 L 848,12 L 838,12" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.8" />
  <path d="M 12,188 L 12,198 L 22,198" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.8" />
  <path d="M 848,188 L 848,198 L 838,198" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.8" />

  <!-- Right-side Orbital HUD Reticle -->
  <g transform="translate(730, 105)">
    <!-- Outer Ring -->
    <circle r="72" fill="none" stroke="#1e3a8a" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3,6" />
    <circle r="56" fill="none" stroke="#0284c7" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="10,5,3,5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite" />
    </circle>
    <!-- Counter-rotating Inner Arc Ring -->
    <circle r="42" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="45,20,10,20">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite" />
    </circle>
    <circle r="28" fill="none" stroke="#2563eb" stroke-width="0.8" stroke-opacity="0.4" />
    <circle r="4" fill="#0284c7" fill-opacity="0.7" />
    <circle r="1.8" fill="#ffffff" />
    <!-- Crosshairs -->
    <line x1="-78" y1="0" x2="-54" y2="0" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="54" y1="0" x2="78" y2="0" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="0" y1="-78" x2="0" y2="-54" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="0" y1="54" x2="0" y2="78" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <!-- Orbiting Satellite -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" />
      <circle cx="42" cy="0" r="2.5" fill="#38bdf8" filter="url(#h-blur)" />
      <circle cx="42" cy="0" r="1.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Animated Bottom Waveform Pulse -->
  <path d="M 38,172 L 140,172 L 165,164 L 195,180 L 220,172 L 480,172 L 505,181 L 530,172 L 822,172" 
        fill="none" stroke="#1e3a8a" stroke-width="1" stroke-opacity="0.35" />
  <path d="M 38,172 L 140,172 L 165,164 L 195,180 L 220,172 L 480,172 L 505,181 L 530,172 L 822,172" 
        fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.85"
        stroke-dasharray="55,270" stroke-dashoffset="325" filter="url(#h-blur)">
    <animate attributeName="stroke-dashoffset" from="325" to="-325" dur="4s" repeatCount="indefinite" />
  </path>

  <!-- Left Content Block -->
  <!-- 1. System Status Pill -->
  <g transform="translate(38, 28)">
    <rect width="280" height="22" rx="11" fill="#08142c" stroke="#1e3a8a" stroke-width="1" stroke-opacity="0.7" />
    <circle cx="14" cy="11" r="3.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="14" cy="11" r="3.5" fill="none" stroke="#38bdf8" stroke-width="0.8">
      <animate attributeName="r" values="3.5;7.5;3.5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="14.8" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" letter-spacing="1">SYSTEMS CORE // ONLINE // DEV_ID</text>
  </g>

  <!-- 2. Primary Name Header -->
  <g transform="translate(38, 86)">
    <text fill="url(#h-name)" font-size="38" font-weight="800" letter-spacing="2.5" style="text-shadow: 0 0 18px rgba(56, 189, 248, 0.35);">
      JACHIN SAMUEL J
    </text>
  </g>

  <!-- 3. Positioning Subtitle -->
  <g transform="translate(40, 116)">
    <text fill="#94a3b8" font-size="14.5" font-weight="500" letter-spacing="0.8">
      Software Engineer <tspan fill="#38bdf8">·</tspan> Applied AI &amp; Local RAG <tspan fill="#38bdf8">·</tspan> Distributed Systems
    </text>
  </g>

  <!-- 4. Glowing Accent Underline -->
  <line x1="40" y1="133" x2="480" y2="133" stroke="url(#h-line)" stroke-width="2" stroke-linecap="round" filter="url(#h-blur)" />
  <line x1="40" y1="133" x2="480" y2="133" stroke="url(#h-line)" stroke-width="1.2" stroke-linecap="round" />

  <!-- 5. Technical Metadata Line -->
  <g transform="translate(40, 155)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#64748b" letter-spacing="0.5">
    <text>
      <tspan fill="#38bdf8" font-weight="700">[EDU]</tspan> B.Tech CSE @ Karunya <tspan fill="#1e3a8a">|</tspan> <tspan fill="#38bdf8" font-weight="700">[CGPA]</tspan> 8.93 / 10.0 <tspan fill="#1e3a8a">|</tspan> <tspan fill="#38bdf8" font-weight="700">[LEAD]</tspan> Academic Software Projects
    </text>
  </g>

</svg>
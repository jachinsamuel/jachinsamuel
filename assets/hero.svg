<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="h-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14" />
      <stop offset="50%" stop-color="#081226" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>

    <!-- Moving Glow Ambient Gradient -->
    <radialGradient id="h-glow1" cx="25%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#050b14" stop-opacity="0" />
      <animate attributeName="cx" values="25%;35%;25%" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="35%;25%;35%" dur="12s" repeatCount="indefinite" />
    </radialGradient>

    <radialGradient id="h-glow2" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#1e40af" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#050b14" stop-opacity="0" />
      <animate attributeName="cx" values="80%;70%;80%" dur="15s" repeatCount="indefinite" />
      <animate attributeName="cy" values="60%;70%;60%" dur="15s" repeatCount="indefinite" />
    </radialGradient>

    <!-- Name Metallic Blue Gradient -->
    <linearGradient id="h-name" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f0f9ff" />
      <stop offset="75%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Accent Underline Gradient -->
    <linearGradient id="h-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="h-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="28" y2="0" stroke="#1e3a8a" stroke-width="0.6" stroke-opacity="0.2" />
      <line x1="0" y1="0" x2="0" y2="28" stroke="#1e3a8a" stroke-width="0.6" stroke-opacity="0.2" />
      <circle cx="0" cy="0" r="0.8" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Filter for Glow Accent -->
    <filter id="h-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas & Border -->
  <rect width="860" height="250" rx="14" fill="url(#h-bg)" />
  <rect width="860" height="250" rx="14" fill="url(#h-grid)" />
  <rect width="860" height="250" rx="14" fill="url(#h-glow1)" />
  <rect width="860" height="250" rx="14" fill="url(#h-glow2)" />
  <rect x="0.5" y="0.5" width="859" height="249" rx="13.5" fill="none" stroke="#1e3a8a" stroke-width="1" stroke-opacity="0.45" />

  <!-- Technical Corner Brackets -->
  <path d="M 14,24 L 14,14 L 24,14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
  <path d="M 846,24 L 846,14 L 836,14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
  <path d="M 14,226 L 14,236 L 24,236" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
  <path d="M 846,226 L 846,236 L 836,236" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- Right-side Orbital HUD Geometry -->
  <g transform="translate(710, 125)">
    <!-- Outer Orbital Ring with ticks -->
    <circle r="88" fill="none" stroke="#1e3a8a" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="4,8" />
    <circle r="72" fill="none" stroke="#0284c7" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="12,6,4,6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite" />
    </circle>
    <!-- Counter-rotating Inner Hex/Arc Ring -->
    <circle r="54" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.55" stroke-dasharray="60,30,10,30">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite" />
    </circle>
    <circle r="36" fill="none" stroke="#2563eb" stroke-width="0.8" stroke-opacity="0.4" />
    <!-- Center Target Core -->
    <circle r="5" fill="#0284c7" fill-opacity="0.6" />
    <circle r="2" fill="#ffffff" />
    <!-- Reticle Crosshairs -->
    <line x1="-95" y1="0" x2="-65" y2="0" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="65" y1="0" x2="95" y2="0" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="0" y1="-95" x2="0" y2="-65" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="0" y1="65" x2="0" y2="95" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <!-- Orbital Satellite Dot -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
      <circle cx="54" cy="0" r="3" fill="#38bdf8" filter="url(#h-blur)" />
      <circle cx="54" cy="0" r="1.8" fill="#ffffff" />
    </g>
  </g>

  <!-- Animated Vector Drawn Path / Pulse Wave -->
  <path d="M 42,205 L 180,205 L 210,195 L 250,215 L 280,205 L 560,205 L 590,218 L 620,205 L 818,205" 
        fill="none" stroke="#1e3a8a" stroke-width="1" stroke-opacity="0.4" />
  <path d="M 42,205 L 180,205 L 210,195 L 250,215 L 280,205 L 560,205 L 590,218 L 620,205 L 818,205" 
        fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.85"
        stroke-dasharray="60,280" stroke-dashoffset="340" filter="url(#h-blur)">
    <animate attributeName="stroke-dashoffset" from="340" to="-340" dur="4.5s" repeatCount="indefinite" />
  </path>

  <!-- Left Content Block -->
  <!-- 1. System Status Pill -->
  <g transform="translate(42, 34)">
    <rect width="270" height="22" rx="11" fill="#08142c" stroke="#1e3a8a" stroke-width="1" stroke-opacity="0.7" />
    <!-- Pulsing Radar Status Indicator -->
    <circle cx="14" cy="11" r="3.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="14" cy="11" r="3.5" fill="none" stroke="#38bdf8" stroke-width="1">
      <animate attributeName="r" values="3.5;8;3.5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="27" y="14.5" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" letter-spacing="1.2">SYS_CORE: ONLINE // DEV_IDENTITY</text>
  </g>

  <!-- 2. Primary Name Header -->
  <g transform="translate(42, 100)">
    <text fill="url(#h-name)" font-size="40" font-weight="800" letter-spacing="2" style="text-shadow: 0 0 20px rgba(56, 189, 248, 0.35);">
      JACHIN SAMUEL J
    </text>
  </g>

  <!-- 3. Positioning Subtitle -->
  <g transform="translate(44, 132)">
    <text fill="#94a3b8" font-size="14.5" font-weight="500" letter-spacing="1">
      Software Engineer <tspan fill="#38bdf8">·</tspan> Applied AI &amp; Local RAG <tspan fill="#38bdf8">·</tspan> Distributed Systems
    </text>
  </g>

  <!-- 4. Glowing Accent Underline -->
  <line x1="44" y1="152" x2="480" y2="152" stroke="url(#h-line)" stroke-width="2.5" stroke-linecap="round" filter="url(#h-blur)" />
  <line x1="44" y1="152" x2="480" y2="152" stroke="url(#h-line)" stroke-width="1.2" stroke-linecap="round" />

  <!-- 5. Technical Metadata Micro-line -->
  <g transform="translate(44, 180)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#64748b" letter-spacing="0.6">
    <text>
      <tspan fill="#38bdf8">[EDU]</tspan> B.Tech CSE @ Karunya <tspan fill="#1e3a8a">|</tspan> <tspan fill="#38bdf8">[CGPA]</tspan> 8.93 / 10.0 <tspan fill="#1e3a8a">|</tspan> <tspan fill="#38bdf8">[LEAD]</tspan> Team Lead @ Academic Projects
    </text>
  </g>

</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 90" width="860" height="90" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <linearGradient id="f-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14" />
      <stop offset="50%" stop-color="#081226" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>

    <linearGradient id="f-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0" />
    </linearGradient>

    <filter id="f-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="860" height="90" rx="10" fill="url(#f-bg)" />
  <rect x="0.5" y="0.5" width="859" height="89" rx="9.5" fill="none" stroke="#1e3a8a" stroke-width="1" stroke-opacity="0.45" />

  <!-- Top Animated Divider Wire -->
  <line x1="16" y1="2" x2="844" y2="2" stroke="#1e3a8a" stroke-width="1" stroke-opacity="0.3" />
  <line x1="16" y1="2" x2="844" y2="2" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="80,400" stroke-dashoffset="480" filter="url(#f-glow)">
    <animate attributeName="stroke-dashoffset" from="480" to="-480" dur="4s" repeatCount="indefinite" />
  </line>

  <!-- Corner Accent Ticks -->
  <path d="M 12,18 L 12,10 L 20,10" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
  <path d="M 848,18 L 848,10 L 840,10" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
  <path d="M 12,72 L 12,80 L 20,80" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
  <path d="M 848,72 L 848,80 L 840,80" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />

  <!-- Status Content -->
  <g transform="translate(32, 38)">
    <!-- Terminal Prompt Line -->
    <circle cx="6" cy="6" r="3" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="10" fill="#7dd3fc" font-size="12" font-weight="600" letter-spacing="1">
      jachin@systems:~$ <tspan fill="#f8fafc">./telemetry --continuous</tspan>
    </text>

    <!-- Telemetry Status Right -->
    <text x="796" y="10" fill="#64748b" font-size="11" text-anchor="end" letter-spacing="0.8">
      CORE: <tspan fill="#38bdf8">ONLINE</tspan> // LATENCY: <tspan fill="#38bdf8">&lt;10ms</tspan> // EGRESS: <tspan fill="#38bdf8">ZERO</tspan>
    </text>
  </g>

  <!-- Sub-line: Build & Identity Signature -->
  <g transform="translate(32, 64)" font-size="10.5" fill="#64748b" letter-spacing="0.5">
    <text x="18" y="0">
      ARCH: <tspan fill="#94a3b8">DISTRIBUTED</tspan> &amp; <tspan fill="#94a3b8">EDGE AI</tspan> | PRIVACY: <tspan fill="#94a3b8">ISOLATED</tspan> | 2026 JACHIN SAMUEL J
    </text>
    <text x="796" y="0" text-anchor="end" fill="#38bdf8">
      // END_OF_TRANSMISSION
    </text>
  </g>
</svg>
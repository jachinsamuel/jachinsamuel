<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 60" width="860" height="60" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <linearGradient id="f-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14" />
      <stop offset="50%" stop-color="#081226" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>

    <filter id="f-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="860" height="60" rx="8" fill="url(#f-bg)" />
  <rect x="0.5" y="0.5" width="859" height="59" rx="7.5" fill="none" stroke="#1e3a8a" stroke-width="1" stroke-opacity="0.4" />

  <!-- Top Animated Divider Wire -->
  <line x1="16" y1="2" x2="844" y2="2" stroke="#1e3a8a" stroke-width="1" stroke-opacity="0.25" />
  <line x1="16" y1="2" x2="844" y2="2" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="60,350" stroke-dashoffset="410" filter="url(#f-glow)">
    <animate attributeName="stroke-dashoffset" from="410" to="-410" dur="4s" repeatCount="indefinite" />
  </line>

  <!-- Status Content -->
  <g transform="translate(28, 34)">
    <circle cx="4" cy="0" r="2.8" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="14" y="4" fill="#7dd3fc" font-size="11" font-weight="600" letter-spacing="0.8">
      jachin@systems:~$ <tspan fill="#f8fafc">./telemetry --online</tspan>
    </text>

    <!-- Telemetry Status Right -->
    <text x="804" y="4" fill="#64748b" font-size="10.5" text-anchor="end" letter-spacing="0.6">
      2026 JACHIN SAMUEL J // <tspan fill="#38bdf8">SYSTEMS HARDENED</tspan>
    </text>
  </g>
</svg>